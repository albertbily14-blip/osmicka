<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Osmička">
<title>Časomíra Osmička</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Layout: one-column pit-wall console, tab bar pinned at the bottom; a race is a full-screen board split into two lanes */
:root{
  color-scheme: dark;
  --bg:#0c0e11; --surface:#15181d; --surface-2:#1d2128; --line:#2a3039;
  --fg:#eef1f5; --muted:#8d96a5; --ink:#0c0e11;
  --l1:#f7c916; --l2:#3fb0ff;
  --red:#ff3b30; --red-dim:#2c1414; --go:#2fd36f; --purple:#b46cff;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.racing{overflow:hidden}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.flag{width:28px;height:20px;border-radius:3px;background:repeating-conic-gradient(var(--fg) 0 25%,var(--bg) 0 50%) 0 0/10px 10px;flex:none}
.brand{font:800 22px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 12px/1.2 var(--f-body);letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:3px}
.camdot{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.camdot i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.camdot.on i{background:var(--go);box-shadow:0 0 8px var(--go)}

main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h2{font:700 15px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h3{font:700 22px/1.15 var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hint{color:var(--muted);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

/* lane picker */
.lanepick{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.chip{font:700 13px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border-radius:6px;color:var(--ink);white-space:nowrap}
.chip.l0{background:var(--l1)} .chip.l1{background:var(--l2)}
.chip small{display:block;font:600 11px/1.1 var(--f-body);letter-spacing:.02em;text-transform:none;margin-top:3px;opacity:.8}
select,input[type=text]{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px}
input[type=range]{width:100%;accent-color:var(--fg)}

/* controls */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:6px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;line-height:1}
.stepper output{min-width:64px;text-align:center;font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stepper output small{font:500 13px var(--f-body);color:var(--muted);margin-left:3px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:11px 14px;font-weight:600}
.btn.primary{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{background:none}
.btn.small{padding:7px 10px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.go-btn{border:0;border-radius:var(--r);padding:18px;font:800 26px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;background:var(--red);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--red) 50%,#000)}
.go-btn:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--red) 50%,#000)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;padding:4px 0;text-align:left}
.toggle .sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle[aria-pressed=true] .sw{background:var(--go)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(18px)}
.toggle span small{display:block;color:var(--muted);font-size:13px}

/* lists & tables */
.list{display:flex;flex-direction:column}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list>div:first-child{border-top:0}
.grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tblwrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px/1 var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.r,th.r{text-align:right}
.pos{font:800 20px/1 var(--f-display);width:28px}
.fl{color:var(--purple)} .pb{color:var(--go)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.l0{background:var(--l1)} .dot.l1{background:var(--l2)}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.banner{border-radius:var(--r);padding:14px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--l1) 18%,var(--surface)),var(--surface));border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);text-align:center;padding:18px 8px;border:1px dashed var(--line);border-radius:var(--r)}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchips button{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:8px 14px}
.pchips button[aria-pressed=true]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.match{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.match .vs{display:flex;flex-direction:column;gap:3px;min-width:0}
.match .no{font:700 14px/1 var(--f-display);color:var(--muted);width:26px}
.win{font-weight:700}
.champ{text-align:center;padding:18px;border-radius:var(--r);background:repeating-conic-gradient(color-mix(in srgb,var(--fg) 8%,transparent) 0 25%,transparent 0 50%) 0 0/24px 24px,var(--surface);border:1px solid var(--line)}
.champ b{display:block;font:800 34px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}

/* camera box */
.cam-slot{display:flex;justify-content:center;background:#000;border-radius:var(--r);overflow:hidden;min-height:60px}
#camHold{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
#camBox{position:relative;display:inline-block;line-height:0;touch-action:none;max-width:100%}
#camBox video{display:block;max-width:100%;max-height:var(--camh,60vh);width:auto;height:auto}
#camBox canvas{position:absolute;inset:0;width:100%;height:100%}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.meter .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px}
.meter .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)}
.meter.l0 .bar i{background:var(--l1)} .meter.l1 .bar i{background:var(--l2)}
.meter .cnt{font:700 22px/1 var(--f-display)}
.meter.flash .cnt{color:var(--go)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current=page]{color:var(--fg)}

/* race board */
.race{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.race-top{display:flex;align-items:center;gap:10px;padding:8px 12px}
.race-top .x{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.race-info{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.25}
.race-info b{display:block;color:var(--fg);font:700 16px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.clock{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.race .cam-slot{border-radius:0;--camh:26vh}
.lights{display:flex;justify-content:center;gap:clamp(6px,2.5vw,14px);padding:8px 12px}
.lights span{width:min(13vw,52px);aspect-ratio:1;border-radius:50%;background:var(--red-dim);border:3px solid #050607;transition:background .05s}
.lights span.on{background:var(--red);box-shadow:0 0 22px var(--red)}
.lights span.green{background:var(--go);box-shadow:0 0 22px var(--go)}
.lanes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 6px;min-height:0}
.lane{--lc:var(--l1);position:relative;border-radius:var(--r);background:var(--surface);border:2px solid color-mix(in srgb,var(--lc) 55%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:52px 8px 56px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;min-height:0;cursor:pointer}
.lane.l1{--lc:var(--l2)}
.lane-head{position:absolute;top:0;left:0;right:0;background:var(--lc);color:var(--ink);padding:7px 10px;display:flex;flex-direction:column;line-height:1.1}
.lane-head b{font:800 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.lane-head span{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-pos{font:800 20px/1 var(--f-display);color:var(--muted);min-height:20px}
.lane-count{font:800 clamp(72px,24vw,150px)/.9 var(--f-display);color:var(--lc);font-variant-numeric:tabular-nums}
.lane-count small{font-size:.32em;color:var(--muted);margin-left:2px}
.lane-last{font:700 26px/1 var(--f-display);font-variant-numeric:tabular-nums;min-height:26px}
.lane-meta{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lane-tag{font:700 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--red);color:#fff;padding:5px 7px;border-radius:5px}
.lane-undo{position:absolute;bottom:8px;left:8px;right:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px;font-size:14px;font-weight:600;color:var(--muted)}
.lane.hit{animation:hit .4s ease-out}
.lane.ign{animation:ign .3s ease-out}
@keyframes hit{from{background:color-mix(in srgb,var(--lc) 45%,var(--surface))}}
@keyframes ign{from{background:var(--surface-2)}}
.lane.done .lane-head{background:repeating-conic-gradient(var(--fg) 0 25%,var(--bg) 0 50%) 0 0/14px 14px}
.lane.done .lane-head b,.lane.done .lane-head span{background:var(--lc);align-self:flex-start;padding:2px 5px;border-radius:3px}
.race-bottom{padding:10px 12px;display:flex;gap:10px;justify-content:center;align-items:center;min-height:64px}
.race-bottom .go-btn{flex:1;max-width:420px}
.race-msg{font:700 20px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.sheet{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 96%,transparent);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:3}
.sheet-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.winner{text-align:center;padding:10px 0 4px}
.winner small{font:700 14px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.winner b{display:block;font:800 clamp(40px,12vw,64px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-top:6px}
.confirm{position:absolute;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:4;box-shadow:0 10px 40px #000a}
@media (orientation:landscape) and (max-height:500px){
  .race .cam-slot{--camh:22vh}
  .lights{padding:2px 12px}
  .lights span{width:min(7vh,40px)}
  .lane{padding:44px 8px 50px}
  .lane-count{font-size:clamp(48px,16vh,120px)}
}
@media (prefers-reduced-motion:reduce){.lane.hit,.lane.ign{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="flag" aria-hidden="true"></div>
  <div class="brand">Osmička<small>časomíra pro autodráhu</small></div>
  <div class="camdot" id="camDot"><i></i><span>kamera vyp.</span></div>
</header>
<main id="main"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="race"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg>Závod</button>
  <button data-act="tab" data-tab="tour"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Turnaj</button>
  <button data-act="tab" data-tab="cam"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Kamera</button>
  <button data-act="tab" data-tab="records"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg>Rekordy</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5.5a3 3 0 0 1 0 5.6M18 14.5c1.9.8 3 2.8 3 5.5"/></svg>Jezdci</button>
</nav>

<div id="camHold"><div id="camBox"><video id="camVideo" playsinline muted autoplay></video><canvas id="camOv"></canvas></div></div>

<div class="race" id="race" hidden>
  <div class="race-top">
    <button class="x" data-ract="close" aria-label="Zavřít závod">✕</button>
    <div class="race-info" id="raceInfo"></div>
    <div class="clock" id="clock">0:00,0</div>
  </div>
  <div class="cam-slot" id="raceCam" hidden></div>
  <div class="lights" id="lights"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="lanes" id="lanes"></div>
  <div class="race-bottom" id="raceBottom"></div>
  <div class="sheet" id="results" hidden></div>
  <div class="confirm" id="raceConfirm" hidden>
    <b>Zrušit závod?</b>
    <span class="hint">Naměřená kola se neuloží.</span>
    <div class="row"><button class="btn" data-ract="keep">Pokračovat</button><button class="btn danger" data-ract="abort">Zrušit závod</button></div>
  </div>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const CAMBOX=$("#camBox");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtLap=ms=>ms==null?"–":(ms/1000).toFixed(3).replace(".",",");
const fmtClock=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,t=Math.floor(ms/100)%10;return `${m}:${String(s).padStart(2,"0")},${t}`};
const kol=n=>n===1?"kolo":(n>=2&&n<=4?"kola":"kol");
const fmtDate=t=>new Date(t).toLocaleString("cs-CZ",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
const LANE_LABEL=["Dráha 1","Dráha 2"];
const PTS_WIN=3, PTS_FL=1;

/* ---------- state & storage (this device) ---------- */
const DEF={minLap:1.5,jumpPenalty:true,sound:true,voice:true,mirror:true,cars:["Žlutá #53","Modrá #24"],mode:"laps",laps:10,minutes:3,
  cam:{auto:true,thr:12,zones:[{x:.62,y:.5,w:.16,h:.16},{x:.38,y:.5,w:.16,h:.16}]}};
const LS="osmicka.v1";
let S=load();
function normalize(s){
  s=s&&typeof s==="object"?s:{};
  const st={...DEF,...(s.settings||{})};
  st.cam={...DEF.cam,...(st.cam||{})};
  if(!Array.isArray(st.cam.zones)||st.cam.zones.length!==2) st.cam.zones=JSON.parse(JSON.stringify(DEF.cam.zones));
  if(!Array.isArray(st.cars)||st.cars.length!==2) st.cars=[...DEF.cars];
  return {drivers:Array.isArray(s.drivers)?s.drivers:[],settings:st,tournaments:Array.isArray(s.tournaments)?s.tournaments:[],races:Array.isArray(s.races)?s.races:[],setup:Array.isArray(s.setup)?s.setup:["",""]};
}
function load(){try{return normalize(JSON.parse(localStorage.getItem(LS)||"null"))}catch{return normalize(null)}}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("Uložení se nepovedlo: v telefonu je plné úložiště prohlížeče.")}},150)}
function saveNow(){clearTimeout(saveT);try{localStorage.setItem(LS,JSON.stringify(S))}catch{}}
try{navigator.storage?.persist?.()}catch{}

const driverName=id=>S.drivers.find(d=>d.id===id)?.name||"";
const laneName=(i,id)=>driverName(id)||S.settings.cars[i];

/* ---------- sound & voice ---------- */
let actx=null;
function audioInit(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch{}}
function beep(f,d=.12,type="square",vol=.12,delay=0){
  if(!S.settings.sound||!actx)return;
  try{const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch{}
}
function say(text){
  if(!S.settings.voice||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="cs-CZ";u.rate=1.08;speechSynthesis.speak(u)}catch{}
}

/* ---------- tournament logic ---------- */
function roundRobin(ids){
  const a=[...ids];if(a.length%2)a.push(null);const n=a.length,out=[];
  for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)out.push(r%2?[y,x]:[x,y])}a.splice(1,0,a.pop())}
  return out;
}
function buildMatches(players,legs){
  const pairs=roundRobin(players),m=[];
  for(let leg=0;leg<legs;leg++)for(const [x,y] of pairs)m.push({id:uid(),leg,l1:leg%2?y:x,l2:leg%2?x:y,res:null,raceId:null});
  return m;
}
const nextMatch=t=>t.matches.find(m=>!m.res);
const tourDone=t=>t.matches.length>0&&t.matches.every(m=>m.res);
function standings(t){
  const rows=Object.fromEntries(t.players.map(p=>[p,{id:p,pts:0,w:0,n:0,best:null}]));
  for(const m of t.matches){if(!m.res)continue;
    for(const p of [m.l1,m.l2]){const r=rows[p];if(!r)continue;r.n++;const b=m.res.best?.[p];if(b!=null&&(r.best==null||b<r.best))r.best=b}
    if(rows[m.res.winner]){rows[m.res.winner].w++;rows[m.res.winner].pts+=PTS_WIN}
    if(rows[m.res.fastest])rows[m.res.fastest].pts+=PTS_FL;
  }
  return Object.values(rows).sort((a,b)=>b.pts-a.pts||b.w-a.w||(a.best??1e12)-(b.best??1e12));
}
const activeTour=()=>[...S.tournaments].sort((a,b)=>b.created-a.created).find(t=>!tourDone(t));

function viewRecords(){
  const rs=S.races;
  if(!rs.length)return `<div class="empty">Zatím žádné závody. Rekordy a historie se objeví po prvním dojetém závodě.</div>`;
  const laneRec=[0,1].map(i=>{let best=null;for(const r of rs){const l=r.lanes[i];if(!l)continue;l.laps.forEach(t=>{if(best==null||t<best.t)best={t,name:l.name,at:r.at}})}return best});
  const per={};
  for(const r of rs)r.lanes.forEach((l,i)=>{const k=l.driverId||`car${i}`;const p=per[k]||(per[k]={name:l.driverId?(driverName(l.driverId)||l.name):S.settings.cars[i],n:0,w:0,best:null,laps:0});p.n++;if(r.winnerLane===i)p.w++;p.laps+=l.laps.length;l.laps.forEach(t=>{if(p.best==null||t<p.best)p.best=t})});
  const prs=Object.values(per).sort((a,b)=>(a.best??1e12)-(b.best??1e12));
  return `
  <section class="card"><h2>Rekordy drah</h2><div class="list">${laneRec.map((b,i)=>`<div><span class="chip l${i}">${LANE_LABEL[i]}</span><div class="grow">${b?`<b class="num" style="font:800 26px/1 var(--f-display)">${fmtLap(b.t)} s</b><div class="hint ellip">${esc(b.name)} · ${fmtDate(b.at)}</div>`:`<span class="hint">zatím nic</span>`}</div></div>`).join("")}</div></section>

  <tbody>${prs.map(p=>`<tr><td>${esc(p.name)}</td><td class="r">${p.n}</td><td class="r">${p.w}</td><td class="r">${p.laps}</td><td class="r">${fmtLap(p.best)}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="card"><h2>Historie</h2><div class="list">${rs.slice(0,60).map(r=>`<div style="display:block"><details><summary>${raceRow(r).replace(/^<div>|<\/div>$/g,"")}</summary>${lapTable(r)}

function lapTable(r){
  const max=Math.max(...r.lanes.map(l=>l.laps.length),0);if(!max)return "";
  const pb=r.lanes.map(l=>l.laps.length?Math.min(...l.laps):null);
  let rows="";for(let k=0;k<max;k++)rows+=`<tr><td>${k+1}</td>${r.lanes.map((l,i)=>{const t=l.laps[k];return `<td class="r ${t==null?"":t===r.fastest?"fl":t===pb[i]?"pb":""}">${t==null?"":fmtLap(t)}</td>`}).join("")}</tr>`;
  return `<div class="tblwrap"><table><thead><tr><th>Kolo</th>${r.lanes.map((l,i)=>`<th class="r"><span class="dot l${i}"></span>${esc(l.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;

/* ---------- race ---------- */
let R=null,raf=0,wake=null;
const pen=L=>L.jump&&S.settings.jumpPenalty?1:0;

const lastT=L=>L.crossings.length?L.crossings[L.crossings.length-1]:Infinity;
const lapsOf=L=>L.crossings.map((t,k)=>t-(k?L.crossings[k-1]:0));

  return [...R.lanes].sort((a,b)=>{
    if(a.finishedAt!=null||b.finishedAt!=null){if(a.finishedAt==null)return 1;if(b.finishedAt==null)return -1;return a.finishedAt-b.finishedAt}

}
function openRace(o){

     lanes:[0,1].map(i=>({i,driverId:o.lanes[i]||"",name:laneName(i,o.lanes[i]),crossings:[],jump:false,finishedAt:null,place:null,last:"",lastCls:""}))};
  const race=$("#race");race.hidden=false;document.body.classList.add("racing");
  $("#results").hidden=true;$("#raceConfirm").hidden=true;
  const t=R.tournamentId&&S.tournaments.find(x=>x.id===R.tournamentId);
  $("#raceInfo").innerHTML=`<b>${R.mode==="laps"?`${R.laps} ${kol(R.laps)}`:`${R.minutes} min`}</b>${t?esc(t.name):"Volný závod"}`;

function buildLanes(){
  const order=S.settings.mirror?[1,0]:[0,1];
  $("#lanes").innerHTML=order.map(i=>`<div class="lane l${i}" data-lane="${i}" role="button" tabindex="0" aria-label="Průjezd cílem, ${LANE_LABEL[i]}"></div>`).join("");
  R.lanes.forEach((_,i)=>drawLane(i));
}
function drawLane(i){
  const L=R.lanes[i],el=$(`.lane[data-lane="${i}"]`);if(!el)return;
  const e=eff(L),rk=ranking(),lead=rk[0],started=R.phase==="racing"||R.phase==="done";
  let pos="",gap="";
  if(started&&R.lanes.some(x=>x.crossings.length)){pos=`P${rk.indexOf(L)+1}`;
    if(L!==lead){const d=eff(lead)-e;if(d>=1)gap=`+${d} ${kol(d)}`;else if(e>0){const a=L.crossings[e-1+pen(L)],b=lead.crossings[e-1+pen(lead)];if(a!=null&&b!=null)gap=`+${fmtLap(a-b)} s`}}}
  const best=L.crossings.length?Math.min(...lapsOf(L)):null;
  el.classList.toggle("done",L.finishedAt!=null);
  el.innerHTML=`<div class="lane-head"><b>${LANE_LABEL[i]}</b><span>${esc(L.name)}</span></div>
    <div class="lane-pos num">${L.finishedAt!=null?`CÍL · ${L.place}.`:pos}${gap?` <small style="font-size:15px">${gap}</small>`:""}</div>
    <div class="lane-count">${e}${R.mode==="laps"?`<small>/${R.laps}</small>`:""}</div>
    <div class="lane-last ${L.lastCls}">${L.last?L.last+" s":""}</div>
    <div class="lane-meta">${best!=null?`nejlepší ${fmtLap(best)} s`:R.phase==="ready"?"čeká na start":"&nbsp;"}</div>
    ${L.jump?`<div class="lane-tag">Ulitý start${S.settings.jumpPenalty?" −1":""}</div>`:""}
    ${R.phase==="racing"&&L.crossings.length?`<button class="lane-undo" data-undo="${i}">↶ Vrátit kolo</button>`:""}`;
}
function lights(n,green){document.querySelectorAll("#lights span").forEach((s,k)=>{s.classList.toggle("on",!green&&k<n);s.classList.toggle("green",!!green)})}

  else if(R.phase==="lights")b.innerHTML=`<div class="race-msg">Připravit…</div>`;

function runLights(){

  for(let k=0;k<5;k++)R.timers.push(setTimeout(()=>{lights(k+1);beep(440,.22,"square",.12)},500+k*900));
  R.timers.push(setTimeout(go,500+4*900+800+Math.random()*2200));
}

  R.phase="racing";R.t0=performance.now();lights(0,true);beep(880,.6,"square",.16);buzz(80);
  R.timers.push(setTimeout(()=>{if(R&&R.phase==="racing")lights(0)},1200));

}
function jumpStart(i){const L=R.lanes[i];if(L.jump)return;L.jump=true;beep(150,.5,"sawtooth",.15);buzz(200);drawLane(i)}

  cancelAnimationFrame(raf);

    if(R.mode==="time"){const rem=R.durMs-el;$("#clock").textContent=fmtClock(rem);if(rem<=0){finalize();return}}
    else $("#clock").textContent=fmtClock(el);
    raf=requestAnimationFrame(f)};
  raf=requestAnimationFrame(f);
}
function flashLane(i,cls){const el=$(`.lane[data-lane="${i}"]`);if(!el)return;el.classList.remove("hit","ign");void el.offsetWidth;el.classList.add(cls)}

  const t=(at??performance.now())-R.t0,prev=L.crossings.length?L.crossings[L.crossings.length-1]:0;
  if(t-prev<S.settings.minLap*1000){if(!fromCam)flashLane(i,"ign");return}

  }else{

  const all=lanes.flatMap((l,i)=>l.laps.map(t=>({t,i})));
  if(!all.length||eff(W)<=0){showResults(null);return}
  const f=all.reduce((a,b)=>b.t<a.t?b:a);
  const race={id:R.id,at:Date.now(),mode:R.mode,target:R.mode==="laps"?R.laps:R.minutes,tournamentId:R.tournamentId,matchId:R.matchId,lanes,winnerLane:W.i,order:rk.map(x=>x.i),fastest:f.t,fastestLane:f.i};

    if(m){const best={};lanes.forEach(l=>{if(l.driverId&&l.laps.length)best[l.driverId]=Math.min(...l.laps)});
      m.res={winner:lanes[W.i].driverId,fastest:lanes[f.i].driverId,best};m.raceId=race.id}}

}
function showResults(race){

  if(!race){s.innerHTML=`<div class="sheet-in"><div class="winner"><small>Závod bez výsledku</small><b>Žádné kolo</b></div><p class="hint" style="text-align:center">Nikdo neprojel cílem, nic se neuložilo.</p><button class="go-btn" data-ract="again">Znovu na start</button><button class="btn" data-ract="done">Zavřít</button></div>`;return}
  const w=race.lanes[race.winnerLane];
  const rows=race.order.map((i,p)=>{const l=race.lanes[i],best=l.laps.length?Math.min(...l.laps):null;
    return `<tr><td class="pos">${p+1}</td><td><span class="dot l${i}"></span>${esc(l.name)}${l.jump?` <span class="hint">(ulitý start)</span>`:""}</td><td class="r">${l.eff}</td><td class="r">${l.total!=null?fmtClock(l.total):"–"}</td><td class="r ${i===race.fastestLane?"fl":""}">${fmtLap(best)}</td></tr>`}).join("");
  s.innerHTML=`<div class="sheet-in">
    <div class="winner"><small>Vítěz · ${LANE_LABEL[race.winnerLane]}</small><b style="color:var(--${race.winnerLane?"l2":"l1"})">${esc(w.name)}</b></div>
    <section class="card"><div class="tblwrap"><table><thead><tr><th></th><th>Jezdec</th><th class="r">Kola</th><th class="r">Čas</th><th class="r">Nejl. kolo</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">Nejrychlejší kolo: <b class="fl">${fmtLap(race.fastest)} s</b> (${esc(race.lanes[race.fastestLane].name)})${t?` · +${PTS_FL} bod do turnaje`:""}</p></section>
    <section class="card"><h2>Kolo po kole</h2>${lapTable(race)}</section>
    ${t?(nm?`<button class="go-btn" data-ract="next">Další závod: ${esc(driverName(nm.l1))} vs ${esc(driverName(nm.l2))}</button>`:`<div class="champ"><h2>Turnaj dokončen</h2><b>${esc(driverName(standings(t)[0]?.id))}</b></div>`)+`<button class="btn" data-ract="toTour">Pořadí turnaje</button>`
      :`<button class="go-btn" data-ract="rematch">Odveta s prohozenými drahami</button><button class="btn" data-ract="again">Znovu stejně</button><button class="btn ghost" data-ract="done">Zavřít</button>`}
  </div>`;
  s.scrollTop=0;
}
function closeRace(){
  if(R){R.timers.forEach(clearTimeout);cancelAnimationFrame(raf)}
  R=null;$("#race").hidden=true;$("#raceConfirm").hidden=true;document.body.classList.remove("racing");releaseWake();try{speechSynthesis.cancel()}catch{}
  render(true);
}
async function requestWake(){try{wake=await navigator.wakeLock?.request("screen")}catch{wake=null}}
function releaseWake(){try{wake?.release()}catch{}wake=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&R&&R.phase!=="done")requestWake()});

const RA={
  go(){runLights()},
  finish(){finalize()},
  close(){if(R.phase==="done"||(R.phase==="ready"))closeRace();else $("#raceConfirm").hidden=false},
  keep(){$("#raceConfirm").hidden=true},
  abort(){closeRace()},
  done(){closeRace()},
  again(){const o=R;closeRace();openRace({lanes:o.lanes.map(l=>l.driverId),mode:o.mode,laps:o.laps,minutes:o.minutes})},
  rematch(){const o=R;closeRace();openRace({lanes:[o.lanes[1].driverId,o.lanes[0].driverId],mode:o.mode,laps:o.laps,minutes:o.minutes})},
  next(){const tid=R.tournamentId;closeRace();const t=S.tournaments.find(x=>x.id===tid),m=t&&nextMatch(t);if(m)openRace({lanes:[m.l1,m.l2],mode:t.mode,laps:t.laps,minutes:t.minutes,tournamentId:t.id,matchId:m.id})},
  toTour(){const tid=R.tournamentId;closeRace();ui.tab="tour";ui.tourOpen=tid;render(true);scrollTo(0,0)},
};
$("#race").addEventListener("pointerdown",e=>{
  if(!R)return;
  const u=e.target.closest("[data-undo]");if(u){e.preventDefault();e.stopPropagation();undo(+u.dataset.undo);return}
  const lane=e.target.closest("[data-lane]");if(!lane)return;e.preventDefault();
  const i=+lane.dataset.lane;
  if(R.phase==="lights")jumpStart(i);else if(R.phase==="racing")laneHit(i);
});
$("#race").addEventListener("click",e=>{const b=e.target.closest("[data-ract]");if(b&&R)RA[b.dataset.ract]?.()});
document.addEventListener("keydown",e=>{
  if(!R||$("#race").hidden||e.repeat)return;
  const m={"1":0,"2":1,ArrowRight:S.settings.mirror?0:1,ArrowLeft:S.settings.mirror?1:0}[e.key];
  if(m!=null){e.preventDefault();if(R.phase==="lights")jumpStart(m);else if(R.phase==="racing")laneHit(m)}
  else if((e.key===" "||e.key==="Enter")&&R.phase==="ready"){e.preventDefault();runLights()}
});

render(true);camDot();
</script>
</body>
</html>
